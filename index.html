<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ★ 구글 폰트: 비동기 로드 (렌더링 차단 방지) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&family=Marcellus&family=Noto+Serif+KR:wght@300;400;500;600;700&family=Jost:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Dodum&family=Nanum+Myeongjo&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Pinyon+Script&family=Italiana&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;500&display=swap" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- iOS Native App-like UX Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="데이와이즈" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>모바일 청첩장</title>
    <meta property="og:title" content="저희 결혼합니다" />
    <meta property="og:description" content="소중한 분들을 초대합니다." />
    <meta property="og:image" content="https://daywise-web-six.vercel.app/images/default_og_image.jpg?v=2" />

    <!-- ★ 에러 핸들러를 가장 먼저 등록 (SDK보다 먼저!) -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:999999;padding:20px;font-size:12px;word-break:break-all;';
        errDiv.innerHTML = 'Error: ' + msg + '<br>Line: ' + line + '<br>Col: ' + col;
        document.body.appendChild(errDiv);
        window.alert('Global Error: ' + msg);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:orange;color:white;z-index:999999;padding:20px;font-size:12px;word-break:break-all;';
        errDiv.innerHTML = 'Unhandled Promise Rejection: ' + (event.reason ? event.reason.toString() : 'Unknown');
        document.body.appendChild(errDiv);
        window.alert('Promise Rejection: ' + (event.reason ? event.reason.toString() : 'Unknown'));
      });
    </script>

    <!-- ★ 카카오 SDK를 async로 변경: 페이지 렌더링을 절대 차단하지 않음 -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous" async></script>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0dd90f0dea818aac4e6a7ae924cc5306&libraries=services" async></script>
  </head>
  <body>
    <!-- ★ React가 마운트되기 전에 즉시 보이는 로딩 화면 -->
    <div id="root">
      <div id="fallback-loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f9f7f2;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;font-family:-apple-system,sans-serif;">
        <div style="width:36px;height:36px;border:3px solid #e5e5e5;border-top:3px solid #333;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px;"></div>
        <div style="color:#333;font-size:15px;font-weight:bold;">청첩장을 불러오는 중...</div>
        <div id="fallback-action" style="display:none;margin-top:30px;text-align:center;">
          <p style="color:#555;font-size:14px;margin-bottom:16px;line-height:1.6;">
            카카오톡 브라우저에서는<br>열리지 않을 수 있습니다.
          </p>
          <button onclick="window.open(location.href,'_system')||window.open(location.href,'_blank')" style="padding:14px 28px;background:#222;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;">
            외부 브라우저에서 열기
          </button>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- ★ 일반 스크립트(non-module): React가 3초 안에 마운트 안 되면 외부 브라우저 버튼 표시 -->
    <script>
      window.__REACT_MOUNTED__ = false;
      setTimeout(function() {
        if (!window.__REACT_MOUNTED__) {
          var action = document.getElementById('fallback-action');
          if (action) action.style.display = 'block';
        }
      }, 3000);
    </script>
  </body>
</html>

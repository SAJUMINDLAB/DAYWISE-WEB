<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ★ 구글 폰트: 비동기 로드 (렌더링 차단 방지) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&family=Marcellus&family=Noto+Serif+KR:wght@300;400;500;600;700&family=Jost:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Dodum&family=Nanum+Myeongjo&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Pinyon+Script&family=Italiana&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;500&display=swap" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- iOS Native App-like UX Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="데이와이즈" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>모바일 청첩장</title>
    <meta property="og:title" content="DAYWISE - 프리미엄 모바일 청첩장" />
    <meta property="og:description" content="클릭 몇 번으로 완성되는 가장 특별한 우리만의 초대장" />
    <meta property="og:image" content="https://www.daywise.kr/images/default_og_image.jpg" />

    <!-- ★ 에러 핸들러를 가장 먼저 등록 (SDK보다 먼저!) -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        // 브라우저 캐시 이슈(ChunkLoadError 등)로 인한 스크립트 에러 발생 시 자동 새로고침
        if (
          (typeof msg === 'string' && (msg.indexOf('Script error') > -1 || 
          msg.indexOf('ChunkLoadError') > -1 || 
          msg.indexOf('Failed to fetch dynamically imported module') > -1)) ||
          (error && error.name === 'ChunkLoadError')
        ) {
          console.warn("캐시된 스크립트 로드 실패 감지. 페이지를 새로고침합니다.");
          // 무한 새로고침 방지를 위해 sessionStorage 사용
          if (!sessionStorage.getItem('reloaded_due_to_script_error')) {
            sessionStorage.setItem('reloaded_due_to_script_error', 'true');
            window.location.reload(true);
            return true; // 에러 무시
          }
        }

        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:999999;padding:20px;font-size:12px;word-break:break-all;';
        errDiv.innerHTML = '<b>[Global Error]</b><br/>' + msg + '<br/>Line: ' + line + ' Col: ' + col + '<br/>URL: ' + url + '<br/><br/>새로고침을 권장합니다.';
        document.body.appendChild(errDiv);
        window.alert('Global Error: ' + msg);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:orange;color:white;z-index:999999;padding:20px;font-size:12px;word-break:break-all;';
        errDiv.innerHTML = 'Unhandled Promise Rejection: ' + (event.reason ? event.reason.toString() : 'Unknown');
        document.body.appendChild(errDiv);
        window.alert('Promise Rejection: ' + (event.reason ? event.reason.toString() : 'Unknown'));
      });
    </script>

    <!-- ★ 카카오 SDK를 async로 변경: 페이지 렌더링을 절대 차단하지 않음 -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous" async></script>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0dd90f0dea818aac4e6a7ae924cc5306&libraries=services&autoload=false" async></script>
  </head>
  <body>
    <!-- ★ React가 마운트되기 전에 즉시 보이는 로딩 화면 -->
    <div id="root">
      <div id="fallback-loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#ffffff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;font-family:'Noto Serif KR', 'Nanum Myeongjo', serif;">
        <div style="width:40px;height:40px;border:1px solid #f0f0f0;border-top:1px solid #333;border-radius:50%;animation:spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;margin-bottom:24px;opacity:0.8;"></div>
        <div style="color:#222;font-size:16px;letter-spacing:0.05em;animation:fadeInOut 2s ease-in-out infinite;">불러오는 중...</div>
        <style>
          @keyframes fadeInOut {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
          }
        </style>
        <div id="fallback-action" style="display:none;margin-top:40px;text-align:center;">
          <p style="color:#555;font-size:13px;margin-bottom:16px;line-height:1.6;font-family:-apple-system,sans-serif;">
            로딩이 지연되고 있습니다.<br>아래 버튼을 눌러주세요.
          </p>
          <button onclick="window.open(location.href,'_system')||window.open(location.href,'_blank')" style="padding:12px 24px;background:#333;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer;font-family:-apple-system,sans-serif;">
            외부 브라우저에서 열기
          </button>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- ★ 일반 스크립트(non-module): React가 3초 안에 마운트 안 되면 외부 브라우저 버튼 표시 -->
    <script>
      window.__REACT_MOUNTED__ = false;
      setTimeout(function() {
        if (!window.__REACT_MOUNTED__) {
          var action = document.getElementById('fallback-action');
          if (action) action.style.display = 'block';
        }
      }, 3000);
    </script>
  </body>
</html>
